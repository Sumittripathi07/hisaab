name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Quality gate for pull requests. Pushes to main skip it and deploy straight away: the PR already ran it.
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      # Dummy value: prisma generate (postinstall) and next build load config but never connect.
      DATABASE_URL: postgresql://build:build@localhost:5432/build
      # Dummy values: next build loads env.ts but sends and signs nothing.
      SMTP_URL: file:///tmp/outbox
      BETTER_AUTH_SECRET: dummy-build-secret-abcdefghijklmnopqrstuvwxyz0123
      BETTER_AUTH_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: dummy-build-google-client-id
      GOOGLE_CLIENT_SECRET: dummy-build-google-client-secret
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hisaab
          POSTGRES_PASSWORD: hisaab
          POSTGRES_DB: hisaab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hisaab -d hisaab_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
      # Reads the pnpm version from package.json "packageManager".
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
        env:
          TEST_DATABASE_URL: postgresql://hisaab:hisaab@localhost:5432/hisaab_test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      # Builds again and serves on :3100 against the test DB (playwright.config.ts). SMTP_URL above is the shared outbox.
      - run: pnpm test:e2e
        env:
          TEST_DATABASE_URL: postgresql://hisaab:hisaab@localhost:5432/hisaab_test
      # The deploy job builds these same two images; a Dockerfile break should fail the PR, not the production deploy.
      # Built and thrown away: nothing is pushed.
      - uses: docker/setup-buildx-action@v4
      - name: Build the web image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: web
          outputs: type=cacheonly
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - name: Build the migrate image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: migrate
          outputs: type=cacheonly
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,scope=migrate,mode=max

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # One deploy at a time, in push order: back-to-back merges queue instead of racing (an older SHA finishing last
    # would roll production back). A newer push replaces any deploy still waiting in the queue.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      CLOUDSDK_CORE_PROJECT: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/hisaab
      RUNTIME_SA: ${{ vars.GCP_RUNTIME_SA }}
      SQL_INSTANCE: ${{ vars.GCP_SQL_INSTANCE }}
      # The public origin: Better Auth builds magic links and the Google redirect URI from it.
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
      # Layer cache in GitHub Actions: unchanged dependency layers are reused, so only changed code rebuilds.
      - uses: docker/setup-buildx-action@v4
      - name: Build and push the web image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: web
          push: true
          tags: ${{ env.IMAGE }}/web:${{ github.sha }}
          cache-from: type=gha,scope=deploy-web
          cache-to: type=gha,scope=deploy-web,mode=max
      - name: Build and push the migrate image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: migrate
          push: true
          tags: ${{ env.IMAGE }}/migrate:${{ github.sha }}
          cache-from: type=gha,scope=deploy-migrate
          cache-to: type=gha,scope=deploy-migrate,mode=max
      - name: Migrate
        run: |
          gcloud run jobs deploy hisaab-migrate --image "$IMAGE/migrate:$GITHUB_SHA" --region "$REGION" \
            --service-account "$RUNTIME_SA" --set-cloudsql-instances "$SQL_INSTANCE" \
            --set-secrets DATABASE_URL=HISAAB_DATABASE_URL:latest
          gcloud run jobs execute hisaab-migrate --region "$REGION" --wait
      - name: Deploy
        run: |
          gcloud run deploy hisaab-web --image "$IMAGE/web:$GITHUB_SHA" --region "$REGION" \
            --service-account "$RUNTIME_SA" --add-cloudsql-instances "$SQL_INSTANCE" \
            --set-secrets DATABASE_URL=HISAAB_DATABASE_URL:latest,BETTER_AUTH_SECRET=HISAAB_BETTER_AUTH_SECRET:latest,GOOGLE_CLIENT_ID=HISAAB_GOOGLE_CLIENT_ID:latest,GOOGLE_CLIENT_SECRET=HISAAB_GOOGLE_CLIENT_SECRET:latest,SMTP_URL=HISAAB_SMTP_URL:latest \
            --set-env-vars "BETTER_AUTH_URL=$APP_URL,EMAIL_FROM=Hisaab <sumit.tpt07@gmail.com>" \
            --min-instances 0 --max-instances 3 --concurrency 500 --timeout 3600 \
            --cpu 1 --memory 512Mi --port 8080 --allow-unauthenticated
      - name: Smoke check
        # On APP_URL, the origin people use and Better Auth is configured for, not the service's own run.app URL.
        run: |
          # /api/health loads env.ts (all real secrets) and queries the DB. /api/auth/ok loads the Better Auth instance
          # (Google client config). /sign-in is the page people land on; it renders without env, so it is not proof alone.
          # Retries cover a cold start; --max-time keeps a hung request from stalling the job.
          for path in /api/health /api/auth/ok /sign-in; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 --retry 3 "${APP_URL%/}$path")
            echo "GET $path -> $code"
            [ "$code" = 200 ] || { echo "expected 200 from $path" >&2; exit 1; }
          done
