name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Dummy value: prisma generate (postinstall) and next build load config but never connect.
      DATABASE_URL: postgresql://build:build@localhost:5432/build
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hisaab
          POSTGRES_PASSWORD: hisaab
          POSTGRES_DB: hisaab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hisaab -d hisaab_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
      # Reads the pnpm version from package.json "packageManager".
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
        env:
          TEST_DATABASE_URL: postgresql://hisaab:hisaab@localhost:5432/hisaab_test
      - run: pnpm build
