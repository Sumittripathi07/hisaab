name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Dummy value: prisma generate (postinstall) and next build load config but never connect.
      DATABASE_URL: postgresql://build:build@localhost:5432/build
      # Dummy values: next build loads env.ts but sends and signs nothing.
      SMTP_URL: file:///tmp/outbox
      BETTER_AUTH_SECRET: dummy-build-secret-abcdefghijklmnopqrstuvwxyz0123
      BETTER_AUTH_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: dummy-build-google-client-id
      GOOGLE_CLIENT_SECRET: dummy-build-google-client-secret
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hisaab
          POSTGRES_PASSWORD: hisaab
          POSTGRES_DB: hisaab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hisaab -d hisaab_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
      # Reads the pnpm version from package.json "packageManager".
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
        env:
          TEST_DATABASE_URL: postgresql://hisaab:hisaab@localhost:5432/hisaab_test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      # Builds again and serves on :3100 against the test DB (playwright.config.ts). SMTP_URL above is the shared outbox.
      - run: pnpm test:e2e
        env:
          TEST_DATABASE_URL: postgresql://hisaab:hisaab@localhost:5432/hisaab_test

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      CLOUDSDK_CORE_PROJECT: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/hisaab
      RUNTIME_SA: ${{ vars.GCP_RUNTIME_SA }}
      SQL_INSTANCE: ${{ vars.GCP_SQL_INSTANCE }}
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
      - name: Build and push images
        run: |
          for target in web migrate; do
            docker build --target "$target" -t "$IMAGE/$target:$GITHUB_SHA" .
            docker push "$IMAGE/$target:$GITHUB_SHA"
          done
      - name: Migrate
        run: |
          gcloud run jobs deploy hisaab-migrate --image "$IMAGE/migrate:$GITHUB_SHA" --region "$REGION" \
            --service-account "$RUNTIME_SA" --set-cloudsql-instances "$SQL_INSTANCE" \
            --set-secrets DATABASE_URL=HISAAB_DATABASE_URL:latest
          gcloud run jobs execute hisaab-migrate --region "$REGION" --wait
      - name: Deploy
        run: |
          gcloud run deploy hisaab-web --image "$IMAGE/web:$GITHUB_SHA" --region "$REGION" \
            --service-account "$RUNTIME_SA" --add-cloudsql-instances "$SQL_INSTANCE" \
            --set-secrets DATABASE_URL=HISAAB_DATABASE_URL:latest \
            --min-instances 0 --max-instances 3 --concurrency 500 --timeout 3600 \
            --cpu 1 --memory 512Mi --port 8080 --allow-unauthenticated
      - name: Smoke check
        run: |
          URL=$(gcloud run services describe hisaab-web --region "$REGION" --format 'value(status.url)')
          curl -fsS "$URL/api/health"
